<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d91"><meta name="description" content="하루 5분 상식퀴즈 1탄! 일반상식 10문제를 풀고 점수와 해설을 확인해 보세요."><title>하루 5분 상식퀴즈 1탄 | 자동 채점</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#152640;background:#f3f8ff}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:16px 14px 48px}.hero{border-radius:24px;background:linear-gradient(125deg,#123d83,#2473bd);color:white;padding:28px 22px;margin:8px 0 20px;box-shadow:0 8px 22px #1a4e8530}.hero .eyebrow{font-size:13px;font-weight:800;color:#dcecff}.hero h1{font-size:clamp(28px,7vw,39px);line-height:1.25;margin:12px 0}.hero p{line-height:1.7;margin:10px 0;color:#e9f5ff}.pill{display:inline-block;background:#fff3a7;color:#263550;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:800}.progressbar{background:#dce8f6;height:10px;border-radius:20px;overflow:hidden}.progressbar div{height:100%;width:0;background:#2a77c9;transition:width .2s}.status{display:flex;justify-content:space-between;margin:10px 2px;font-size:14px;font-weight:700}.question{background:white;border:1px solid #e2eaf4;border-radius:20px;padding:21px 18px;margin:14px 0;box-shadow:0 3px 12px #224f7810}.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.num{background:#e6f2ff;color:#1253a0;border-radius:12px;padding:6px 10px;font-weight:850}.cat{font-size:13px;color:#60738b}.question h2{font-size:18px;line-height:1.55;margin:0 0 16px}.options{display:grid;gap:10px}.option{display:flex;align-items:center;gap:10px;min-height:52px;border:2px solid #e1eaf5;border-radius:13px;padding:11px 13px;cursor:pointer;font-size:16px;line-height:1.4}.option:has(input:checked){border-color:#2876c8;background:#edf6ff;font-weight:750}.option input{accent-color:#216bb9;width:19px;height:19px;flex:none}.option:focus-within{outline:2px solid #85baff;outline-offset:2px}.feedback{margin-top:15px;padding:14px;border-radius:12px;line-height:1.65;background:#f3f7fc}.feedback.good{border-left:5px solid #24976a}.feedback.bad{border-left:5px solid #dc6464}.feedback strong{display:block}.actions{position:sticky;bottom:0;background:#f3f8fff0;backdrop-filter:blur(10px);padding:12px 0;z-index:2}button{border:0;border-radius:13px;min-height:52px;padding:12px 20px;font-size:16px;font-weight:800;cursor:pointer}button:focus-visible{outline:3px solid #f5a623;outline-offset:2px}.primary{background:#195eae;color:white;width:100%}.primary:disabled{background:#aab9c9;cursor:not-allowed}.secondary{background:#e8f0fc;color:#174d91}.result{display:none;text-align:center;background:#fff;border:2px solid #a5cfff;border-radius:22px;padding:25px 16px;margin:20px 0}.result h2{font-size:25px}.score{font-size:54px;font-weight:900;color:#125ca8;margin:10px}.result p{line-height:1.65}.result .buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.foot{text-align:center;font-size:13px;color:#66798c;margin:25px 0}.hint{text-align:center;color:#637991;font-size:13px;margin:8px 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:420px){.hero{padding:24px 18px}.question{padding:18px 14px}.question h2{font-size:17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><main><header class="hero"><span class="eyebrow">2026년 11월 1일 · 제1탄</span><h1>🧠 하루 5분<br>상식퀴즈</h1><span class="pill">일반상식 10문제 · 100점 만점</span><p>하루 딱 5분! 역사·과학·경제·우리말 등 재미있는 문제에 도전하세요. 모두 선택한 뒤 채점하면 내 점수와 정답 해설을 볼 수 있어요.</p></header><section aria-label="풀이 진행 상황"><div class="status"><span id="progressText">0 / 10문제 선택</span><span id="percent">0%</span></div><div class="progressbar" role="progressbar" aria-label="풀이 진행률" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress"><div id="fill"></div></div></section><form id="quiz" novalidate></form><div class="actions"><button class="primary" id="submit" disabled type="button">10문제 모두 선택해 주세요</button><div class="hint" id="remaining">10문제 남았습니다</div></div><section class="result" id="result" tabindex="-1" aria-live="polite"><div style="font-size:42px">🏆</div><h2>오늘의 퀴즈 결과</h2><div class="score" id="score"></div><h3 id="grade"></h3><p id="resultDesc"></p><p>아래에서 문제별 정답과 해설도 확인해 보세요!</p><div class="buttons"><button type="button" class="secondary" id="copy">📋 결과 복사</button><button type="button" class="secondary" id="reset">🔄 다시 풀기</button></div></section><footer class="foot">점수 등급은 재미를 위한 것으로 실제 지능이나 능력을 평가하지 않습니다.<br>개인정보를 수집하거나 답안을 서버에 전송하지 않습니다.</footer></main><script>
'use strict';
const questions=[
{cat:'역사와 한국사',q:'조선시대 훈민정음을 창제한 왕은 누구일까요?',o:['태조','세종','정조','영조'],a:1,why:'세종대왕은 1443년 훈민정음을 창제하고 1446년에 반포했습니다. 처음 훈민정음은 28자로 구성되었습니다.'},
{cat:'과학과 자연',q:'태양계에서 가장 큰 행성은 무엇일까요?',o:['지구','토성','해왕성','목성'],a:3,why:'목성은 태양계에서 가장 큰 행성으로, 수소와 헬륨이 주성분입니다. 거대한 폭풍인 대적점으로도 유명합니다.'},
{cat:'건강과 생활상식',q:'햇빛을 받으면 피부에서 합성될 수 있는 비타민은 무엇일까요?',o:['비타민 D','비타민 C','비타민 B12','비타민 K'],a:0,why:'피부에 자외선 B가 닿으면 비타민 D가 합성될 수 있습니다. 비타민 D는 칼슘 흡수와 뼈 건강에 중요한 역할을 합니다.'},
{cat:'경제와 돈',q:'일반적으로 물가가 지속적으로 상승하는 현상을 무엇이라고 할까요?',o:['디플레이션','스태그플레이션','인플레이션','디스인플레이션'],a:2,why:'인플레이션은 상품과 서비스의 전반적인 가격 수준이 지속적으로 상승하는 현상입니다. 디스인플레이션은 물가 상승률이 둔화하는 것입니다.'},
{cat:'세계지리와 문화',q:'다음 중 적도가 지나가는 나라는 어디일까요?',o:['일본','에콰도르','독일','뉴질랜드'],a:1,why:'에콰도르는 남아메리카에 있는 나라로 적도가 지나갑니다. 에콰도르라는 국명도 스페인어로 적도를 뜻합니다.'},
{cat:'음식과 식생활',q:'두부를 만드는 데 주로 사용하는 원료는 무엇일까요?',o:['밀','보리','옥수수','콩'],a:3,why:'두부는 주로 대두를 갈아 만든 콩물을 응고시켜 만듭니다. 응고제와 제조 방식에 따라 질감이 달라집니다.'},
{cat:'우리말과 맞춤법',q:'다음 중 ‘아주 짧은 시간 안에’라는 뜻의 올바른 맞춤법은 무엇일까요?',o:['금세','금새','금쎄','금쌔'],a:0,why:'금세는 금시에가 줄어든 말입니다. 금새는 물건의 값이나 시세를 뜻하는 별개의 말입니다.'},
{cat:'예술과 문학',q:'소설 『어린 왕자』의 작가는 누구일까요?',o:['빅토르 위고','알베르 카뮈','앙투안 드 생텍쥐페리','쥘 베른'],a:2,why:'『어린 왕자』는 프랑스 작가이자 비행사인 생텍쥐페리의 작품으로, 1943년에 처음 출간되었습니다.'},
{cat:'동물과 식물 · OX',q:'문어의 심장은 총 3개이다.',o:['⭕ O','❌ X'],a:0,why:'문어의 심장 두 개는 아가미로 혈액을 보내고, 다른 한 개는 몸 전체로 혈액을 순환시킵니다.'},
{cat:'생활상식 · OX',q:'유리컵은 전자레인지에 넣으면 종류와 관계없이 모두 안전하다.',o:['⭕ O','❌ X'],a:1,why:'내열성이 부족하거나 금속 장식이 있는 유리컵은 위험할 수 있습니다. 전자레인지 사용 가능 표시를 확인하세요.'}
];
const form=document.getElementById('quiz');const selected=Array(questions.length).fill(null);let graded=false;let finalScore=0;
questions.forEach((q,i)=>{const section=document.createElement('section');section.className='question';section.id='q'+(i+1);const top=document.createElement('div');top.className='qtop';top.innerHTML='<span class="num">Q'+(i+1)+'</span><span class="cat"></span>';top.querySelector('.cat').textContent=q.cat;section.append(top);const h=document.createElement('h2');h.textContent=q.q;section.append(h);const opts=document.createElement('div');opts.className='options';q.o.forEach((option,j)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=String(j);input.addEventListener('change',()=>{if(graded)return;selected[i]=j;updateProgress()});const span=document.createElement('span');span.textContent=(i<8?'①②③④'[j]+' ':'')+option;label.append(input,span);opts.append(label)});section.append(opts);const feedback=document.createElement('div');feedback.className='feedback';feedback.id='f'+i;feedback.hidden=true;section.append(feedback);form.append(section)});
const submit=document.getElementById('submit');function updateProgress(){const n=selected.filter(v=>v!==null).length;document.getElementById('progressText').textContent=n+' / 10문제 선택';document.getElementById('percent').textContent=n*10+'%';document.getElementById('fill').style.width=n*10+'%';document.getElementById('progress').setAttribute('aria-valuenow',String(n));submit.disabled=n!==10;submit.textContent=n===10?'정답 확인 및 점수 계산':'10문제 모두 선택해 주세요';document.getElementById('remaining').textContent=n===10?'모든 문제를 선택했습니다!':(10-n)+'문제 남았습니다'}
submit.addEventListener('click',()=>{if(selected.some(v=>v===null)||graded)return;graded=true;finalScore=questions.reduce((n,q,i)=>n+(selected[i]===q.a?1:0),0);questions.forEach((q,i)=>{const correct=selected[i]===q.a;const f=document.getElementById('f'+i);f.hidden=false;f.classList.add(correct?'good':'bad');const heading=document.createElement('strong');heading.textContent=(correct?'✅ 정답입니다!':'❌ 아쉬워요!')+' 정답: '+(i<8?'①②③④'[q.a]+' ':'')+q.o[q.a];const expl=document.createElement('div');expl.textContent=q.why;f.append(heading,expl);form.querySelectorAll('input[name="q'+i+'"]').forEach(input=>input.disabled=true)});const grade=finalScore<=3?'🌱 상식 새싹':finalScore<=6?'🧭 상식 탐험가':finalScore<=8?'🎓 상식 고수':'👑 오늘의 상식왕';document.getElementById('score').textContent=finalScore*10+'점';document.getElementById('grade').textContent=grade;document.getElementById('resultDesc').textContent='10문제 중 '+finalScore+'문제를 맞혔습니다!';document.getElementById('result').style.display='block';submit.disabled=true;submit.textContent='채점 완료';document.getElementById('remaining').textContent='정답과 해설을 확인하세요.';document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('result').focus({preventScroll:true})});
document.getElementById('reset').addEventListener('click',()=>{graded=false;finalScore=0;selected.fill(null);form.reset();form.querySelectorAll('input').forEach(x=>x.disabled=false);form.querySelectorAll('.feedback').forEach(x=>{x.hidden=true;x.className='feedback';x.replaceChildren()});document.getElementById('result').style.display='none';updateProgress();window.scrollTo({top:0,behavior:'smooth'})});
document.getElementById('copy').addEventListener('click',async()=>{const grade=document.getElementById('grade').textContent;const msg='하루 5분 상식퀴즈 1탄! 저는 '+finalScore*10+'점, '+grade+'입니다!';try{await navigator.clipboard.writeText(msg);document.getElementById('copy').textContent='✅ 복사 완료'}catch(e){window.prompt('결과를 복사하세요',msg)}});
</script></body></html>
